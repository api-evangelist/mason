aid: mason
name: Mason
description: >-
  Mason (getmason.io), the company behind the ModeMagic Shopify app, is an
  AI-powered "agentic shopping engine" for ecommerce brands. Built by Kubric, the
  platform pairs merchandising, promotion, conversion and gamification AI agents
  with a developer platform for programmatic creative generation and commerce
  automation. Its public developer hub at getmason.dev documents a REST API
  (OAuth2 bearer, base host https://api.getmason.io) spanning app provisioning,
  template-driven image/creative generation (Genie), long-running creative tasks,
  asset search, webhook subscriptions, and a promotion/discount engine (Scrooge)
  for tiered, bulk and Buy-X-Get-Y discounts, plus a custom-checkout integration
  contract. Surfaced as a portfolio company of Accel, GGV Capital, Point Nine and
  Y Combinator; this profile was enriched by the API Evangelist pipeline from
  Mason's published OpenAPI, llms.txt and developer documentation.
